name: Nix Flake Check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05

      - name: Nix flake check
        run: |
          nix --version
          nix flake show
          nix flake check --print-build-logs
