name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq just zip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install nox jinja2 pyyaml

      - name: Validate manifest (schema/content)
        run: |
          nox -s validate_manifest --error-on-missing-interpreters

      - name: Verify manifest matches sources (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bash ./verify.sh

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.8.0
      - name: Ruff (lint)
        run: ruff check .
      - name: Black (format check)
        run: black --check .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Bandit
        run: bandit -r -q -x .venv,venv,.git .
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-git --redact --source . --config-path .gitleaks.toml

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
      - name: Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml

  render-docs:
    runs-on: ubuntu-latest
    needs: [build-validate, lint-python, security-scan, lint-docs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 pyyaml

      - name: Render default docs
        run: |
          python3 ./render.py \
            --context ./copier-defaults.yaml \
            --out-dir ./_rendered \
            --in-dir ./src/project_vo2_scaffolder/data_files/templates

      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: rendered-docs
          path: _rendered
