#
# @project: Project VO2
# @file:    project.conf
# @author:  Project VO2 Contributors
# @brief:   Central configuration file for all project scripts.
#
# This file contains all the key-value pairs that define the project's
# structure and file names. It is the single source of truth for the
# bootstrap and generator scripts.
#

# --- Project Identity ---
export PROJECT_NAME="Project VO2: An Open-Source Instrument"

# --- Directories ---
export TEMPLATE_DIR="templates"
export OUTPUT_DIR="docs_generated"
export SCRIPT_DIR="scripts"
export VENV_DIR=".venv"
export SRC_DIR="src"

# --- Source Files ---
export STATE_FILE="${SRC_DIR}/vo2_project_state.jsonl"
export GENERATOR_SCRIPT="${SRC_DIR}/generate_docs.py"

# --- Template Files ---
# A space-separated list of template files to be created.
export TEMPLATE_FILES=(
    "README.md.j2"
    "Project_Charter.md.j2"
    "ADR.md.j2"
)
